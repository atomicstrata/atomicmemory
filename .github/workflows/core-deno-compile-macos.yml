name: Core Deno compile (macOS)

on:
  pull_request:
    paths:
      - 'packages/core/**'
      - '.github/workflows/core-deno-compile-macos.yml'
  push:
    branches:
      - main
      - feat/core-deno-lean-binary
    paths:
      - 'packages/core/**'
      - '.github/workflows/core-deno-compile-macos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deno-compile-darwin-arm64:
    name: deno-compile-darwin-arm64
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.9.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @atomicmemory/core

      - name: Compile Core binary
        working-directory: packages/core
        run: ./scripts/deno-compile-core.sh

      - name: Smoke help
        working-directory: packages/core
        # --help is a compile smoke only. Storage upload/read/delete is
        # scripts/macos-compiled-storage-smoke.sh against a reachable database.
        run: ./dist-bin/atomicmemory-core-darwin-arm64 --help

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: atomicmemory-core-darwin-arm64
          path: packages/core/dist-bin/atomicmemory-core-darwin-arm64
          if-no-files-found: error
