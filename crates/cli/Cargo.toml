[package]
name = "atomicmemory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "AtomicMemory CLI — browser login, projects, API keys, and memory operations"
readme = "README.md"
license.workspace = true
publish = false
repository = "https://github.com/atomicstrata/atomicmemory"
homepage = "https://github.com/atomicstrata/atomicmemory"
documentation = "https://github.com/atomicstrata/atomicmemory/tree/main/crates/cli"
keywords = ["atomicmemory", "cli", "ai", "agents", "memory"]
categories = ["command-line-utilities"]
authors = ["Atomic Strata"]

# `cargo install --path crates/cli` installs the `am` binary.
[[bin]]
name = "am"
path = "src/main.rs"

